apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "co.acoustic.mobile.push.sample"
    defaultConfig {
        applicationId "co.acoustic.mobile.push.sample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// google-services.json (FCM project with package co.acoustic.mobile.push.sample) is gitignored.
// Local: copy it to android/app/. CI: point GOOGLE_SERVICES_JSON at a file credential and it is copied in,
// e.g. withCredentials([file(credentialsId: 'ca-google-services', variable: 'GOOGLE_SERVICES_JSON')]) { ... }.
def googleServicesFile = file("google-services.json")
def googleServicesSource = System.getenv("GOOGLE_SERVICES_JSON")
if (!googleServicesFile.exists() && googleServicesSource) {
    def source = file(googleServicesSource)
    if (!source.isFile()) {
        throw new GradleException("GOOGLE_SERVICES_JSON is set but ${source} is not a file.")
    }
    googleServicesFile.bytes = source.bytes
    logger.lifecycle("Copied google-services.json from GOOGLE_SERVICES_JSON")
}
if (!googleServicesFile.exists()) {
    throw new GradleException("SampleApp/android/app/google-services.json is missing. FCM registration and push need it. " +
        "Copy the Firebase config for package co.acoustic.mobile.push.sample to ${googleServicesFile}, " +
        "or set GOOGLE_SERVICES_JSON to its path (CI: Jenkins file credential).")
}

apply plugin: "com.google.gms.google-services"
googleServices { disableVersionCheck = true }

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
