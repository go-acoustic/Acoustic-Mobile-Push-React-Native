apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "co.acoustic.mobile.push.plugin.displayweb"
  compileSdk safeExtGet("compileSdkVersion", 37)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 24)
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    compileOnly('com.facebook.react:react-native:+') {
        exclude group: 'com.android.support'
    }
  implementation "io.github.go-acoustic:acoustic-mobile-push-android-sdk:$campaignSDKVersion"
}

